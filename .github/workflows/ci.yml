name: CI

on:
  push:
  pull_request:

# The suite used to run as ONE job and took about 36 minutes, almost all of it in the
# test step: the long simulations (a 24-hour homeostasis run, the nutrition scenarios,
# the pharmacology golden tests) ran one after another on a single runner. It is now
# two jobs. `verify` answers "does it lint, type-check and build" in about a minute;
# `test` runs the same suite split across six runners with Vitest's own sharding.
# Sharding assigns every test file to exactly one shard by a hash of its path, so a
# newly added test file is picked up automatically and can never be left out, which a
# hand-written list of files per job could not promise.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # Layer isolation is a build failure, not a review comment: src/sim must stay
      # free of three, React, the DOM, Math.random and Date.now.
      - name: Lint (includes layer isolation)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The pipeline must be idempotent and must diff cleanly against the committed
      # data (spec 5.6). Re-running it from the cache and finding a diff means either
      # the data was hand-edited or the pipeline is not deterministic.
      - name: Regenerate data from cache and check it is unchanged
        run: |
          if [ -d .cache/ingest ]; then
            npm run ingest:offline
            git diff --exit-code -- src/data/drugs.json src/data/receptors.json
          else
            echo "No ingest cache committed; skipping idempotence check."
          fi

      - name: Placeholder triangle budget
        run: npm run organs

  test:
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others: the point of a red run is to see
      # everything that is broken, not only the first thing.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: test (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The whole suite, including the 24-hour homeostasis run, the determinism
      # check, the pharmacology golden tests against each drug's own citation, the
      # render order-independence proof, and the tick-budget test.
      - name: Test (shard ${{ matrix.shard }} of 6)
        run: npm test -- --shard=${{ matrix.shard }}/6

  # BROWSER TESTS OF THE PRODUCTION BUILD. Lint, types, the build and the simulation tests
  # never open the app, so a blank page, a console error on boot, a lost COOP/COEP header
  # (which silently degrades the waveform channel) or a control painted over by a panel could
  # reach the live site with every other job green. This job builds the app exactly as
  # Vercel does and drives it in headless Chromium at a desktop and a phone size.
  #
  # It serves the PRODUCTION build (`vite preview` of dist/, started by Playwright itself),
  # not the dev server: the dev server has `window.__corpus`, unminified code and Vite's own
  # overlay, none of which a visitor gets, and it hides faults that only a bundle has.
  #
  # The runner has no GPU, so the browser is launched with SwiftShader software WebGL (the
  # flags are in playwright.config.ts). That is slow, which is why the timeouts are generous.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Browser tests
        run: npm run e2e

      # The report and the failure screenshots are the only way to see what the runner saw.
      - name: Upload the report and the failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
