<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f0f0f0" />
    <!-- The clinical-use warning is in the page title as well as the UI footer
         (spec 10.1), so it is present in a tab, a bookmark and a share card. -->
    <title>CORPUS — Human Physiology Simulator — NOT FOR CLINICAL USE</title>
    <meta
      name="description"
      content="CORPUS is a real-time, browser-based simulation of adult human physiology and pharmacology. Educational simulation only — NOT FOR CLINICAL USE."
    />
    <!-- The UI font is self-hosted (@fontsource-variable/nunito, imported in src/main.tsx), so
         there is no third-party font request and weights 600 and 800 genuinely exist. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      CORPUS is a real-time simulation and needs JavaScript. It is an educational tool and is
      NOT FOR CLINICAL USE.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
